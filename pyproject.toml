[project]
name = "controlkit"
version = "0.1.0"
description = "MuJoCo playground for control algorithms (classical, MPC, RL)"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    # RL
    "gymnasium[mujoco]>=0.29",
    "stable-baselines3>=2.3",
    "typer>=0.26.7",
]

[project.optional-dependencies]
dev = ["ipython", "ruff"]
mjx = ["mujoco-mjx==3.9.0"]
# GPU JAX (Linux + NVIDIA only). Inherits the jax version resolved by `mjx`;
# the marker keeps it off macOS, where no CUDA wheels exist. See README.
gpu = ["jax[cuda12]; sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
