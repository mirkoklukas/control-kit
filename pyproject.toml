[project]
name = "controlkit"
version = "0.1.0"
description = "MuJoCo playground for control algorithms (classical, MPC, RL)"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    # RL
    "gymnasium[mujoco]>=0.29",
    "stable-baselines3>=2.3",
    "typer>=0.26.7",
    "pyyaml>=6",
    "rich>=13",
    "runkit",
]

[project.scripts]
ctk = "controlkit.cli:app"

[project.optional-dependencies]
dev = ["ipython", "ruff"]
# warp-lang silences mujoco's optional Warp-backend import probe (the
# "Failed to import warp" prints); it does NOT change the backend -- MJX still
# defaults to JAX unless MJX_GPU_DEFAULT_WARP=true.
mjx = ["mujoco-mjx==3.9.0", "warp-lang"]
# PPO training (Brax) on top of MJX. Pulls flax/optax/orbax. Run with
# `uv run --extra ppo ...`; includes the mjx stack.
ppo = ["controlkit[mjx]", "brax>=0.10"]
# GPU JAX (Linux + NVIDIA only). Inherits the jax version resolved by `mjx`;
# the marker keeps it off macOS, where no CUDA wheels exist. See README.
gpu = ["jax[cuda12]; sys_platform == 'linux'"]
# Full GPU training stack: ppo + gpu in one flag, so the same `--extra vm`
# works for testing and running on the cloud GPU box. On macOS the gpu part
# is a no-op (marker), so this just resolves to the ppo stack.
vm = ["controlkit[gpu,ppo]"]

# runkit lives in its own repo now; consumed as a local editable checkout.
[tool.uv.sources]
runkit = { path = "../run-kit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlkit", "lab"]

[tool.ruff]
line-length = 100
